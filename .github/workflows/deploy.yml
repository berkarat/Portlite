name: Deploy Portlite

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: portlite-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, portlite-vm]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t portlite-api:latest .

      - name: Recreate container
        run: |
          docker rm -f portlite-api || true
          docker run -d --name portlite-api \
            --restart=always \
            --network portlite_portlite \
            --network-alias api \
            -p 8080:8080 \
            --env-file /home/azureuser/portlite/api.env \
            portlite-api:latest

      - name: Health check
        run: |
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/ || true)
            echo "attempt $i -> HTTP $code"
            if [ "$code" = "200" ]; then echo "healthy"; exit 0; fi
            sleep 3
          done
          echo "health check failed"; docker logs --tail 60 portlite-api; exit 1

      - name: Prune dangling images
        if: always()
        run: docker image prune -f
